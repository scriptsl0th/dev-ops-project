apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-ops-backend
  namespace: devops-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dev-ops-backend
  template:
    metadata:
      labels:
        app: dev-ops-backend
    spec:
      containers:
        - name: backend
          image: scriptsl0th/dev-ops-project-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-service:5432/test_db
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
